name: 'AuditLane Verification Ledger'
description: 'Audits PRs against a phonebook and verifies verbal authorization claims via telephony.'
branding:
  icon: 'phone-call'
  color: 'blue'
inputs:
  github_token:
    description: 'GitHub token for posting PR comments and status checks'
    required: true
  calle_api_key:
    description: 'CALL-E telephony API key'
    required: true
  dress_rehearsal:
    description: 'If true, skips live calls and simulates deterministic verifications'
    required: false
    default: 'true'
  phonebook_path:
    description: 'Path to the phonebook JSON relative to workspace'
    required: false
    default: 'phonebook.json'
  repository:
    description: >
      owner/repo of the calling workflow. Must be passed explicitly
      from the calling workflow file -- the github context does not
      resolve inside a Docker action's own action.yml when referenced
      cross-repo via a uses: owner/repo@ref step, only within an actual
      workflow file under .github/workflows/.
    required: true
  pr_number:
    description: 'The pull request number, from the calling workflow.'
    required: true
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: ${{ inputs.github_token }}
    GITHUB_REPOSITORY: ${{ inputs.repository }}
    CALLE_API_KEY: ${{ inputs.calle_api_key }}
    AUDITLANE_DRESS_REHEARSAL: ${{ inputs.dress_rehearsal }}
  # No --github-event arg: the script falls back to this container's own
  # GITHUB_EVENT_PATH (auto-injected by the runner, already correctly
  # pointing at the in-container mount) instead of a host-side path that
  # doesn't resolve to anything inside the container -- see
  # scripts/run_verification.py.
  args:
    - --pr-ref
    - ${{ inputs.repository }}#${{ inputs.pr_number }}
    - --phonebook
    - ${{ inputs.phonebook_path }}
    - --post-to-github
